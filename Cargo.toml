[package]
name = "ikigai-judge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Judgments as resources for ikigai: classify items as recorded verdicts (person, mapping, model, bayes, pending), with a disagreement signal and correction as the resolution."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-judge"
homepage = "https://github.com/ikigai-rs/ikigai-judge"
readme = "README.md"
keywords = ["ikigai", "roc", "classification", "judgment", "module"]
categories = ["wasm", "text-processing"]

[dependencies]
# The released kernel, consumed from crates.io: the same version the hosts use, so a host
# links exactly one `ikigai-core`. 0.2.10 is the newest published. ⚠ `"0.2.10"` is also a
# ceiling below 0.3.0.
ikigai-core = "0.2.10"
